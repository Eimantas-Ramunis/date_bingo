services:
  app:
    build: .
    restart: always
    ports:
      - "8880:8880"
    volumes:
      - ./data:/data
    environment:
      - NODE_ENV=production
      - PORT=8880
      - DATABASE_URL=file:/data/datebingo.db
      - SESSION_SECRET=change_this_secret_in_prod
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - RATE_LIMIT_GLOBAL_PER_MIN=60
      - RATE_LIMIT_RECEIVER_PER_MIN=20
      - RATE_LIMIT_AI_PER_MIN=10
      - UPLOAD_DIR=/data/uploads
